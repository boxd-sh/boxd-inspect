[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "boxd-inspect"
dynamic = ["version"]
description = "boxd sandbox for Inspect AI: each sample runs on its own boxd machine, with Docker inside for compose tasks."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "boxd", email = "contact@boxd.sh" }]
keywords = ["inspect", "inspect-ai", "evals", "sandbox", "boxd", "agents", "microvm"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = [
  "boxd>=0.3.1",
  "inspect-ai>=0.3.289",
  "pydantic>=2",
  "pyyaml>=6",
  "typing-extensions>=4.5",
]

[project.urls]
Homepage = "https://boxd.sh"
Documentation = "https://docs.boxd.sh/?ref=boxd-inspect"
Repository = "https://github.com/boxd-sh/boxd-inspect"
Issues = "https://github.com/boxd-sh/boxd-inspect/issues"
Changelog = "https://github.com/boxd-sh/boxd-inspect/blob/main/CHANGELOG.md"

# Inspect loads this module at startup, which registers the "boxd" sandbox type.
[project.entry-points.inspect_ai]
boxd_inspect = "boxd_inspect._registry"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "mypy>=1.11",
  "ruff>=0.6",
  "types-PyYAML",
  # The examples use Claude; any model Inspect supports works.
  "anthropic",
]

[tool.hatch.version]
path = "src/boxd_inspect/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/boxd_inspect"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "README.md", "CHANGELOG.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider -m 'not live'"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: needs BOXD_API_KEY and makes real boxd machines (run with -m live)"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# Code blocks in the Markdown files keep their aligned comments.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "C4", "PT", "D"]
ignore = ["D105", "D107", "D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"examples/**" = ["D"]

[tool.mypy]
strict = true
